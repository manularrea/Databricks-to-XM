# CI/CD del producto xm-demanda (clases 8, 13 y 14).
#
#   pull_request ─► test + integration + validate          (CI: ¿el cambio es seguro?)
#   push a main  ─► … + deploy-dev                         (CD continuo a dev)
#   tag v*       ─► … + deploy-qa ─► [aprobación] ─► deploy-prod
#                     (deploy + preparar + job diario: el chequeo de frescura es la prueba de integración)
#
# Los jobs que hablan con Databricks solo corren si el repo tiene la variable
# DATABRICKS_DEPLOY=true (Settings → Secrets and variables → Actions → Variables)
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

# Una promoción a la vez por rama o tag: dos deploys simultáneos al mismo ambiente se pisan.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
  BUNDLE_VAR_git_sha: ${{ github.sha }}   # queda como tag en cada job desplegado: qué versión corre

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest tests/unit

  # Pruebas de integración con Spark local (clase 8). Reglas del contrato de oro sobre datos sintéticos.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -e ".[dev,spark]"
      - run: pytest tests/integration -q

  # El bundle se valida contra el workspace real: variables, rutas, permisos, modo producción.
  validate:
    if: vars.DATABRICKS_DEPLOY == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main   # en producción: fija la versión (tag o SHA)
      - run: databricks bundle validate -t dev
      - run: databricks bundle validate -t qa
      - run: databricks bundle validate -t prod

  deploy-dev:
    if: github.ref == 'refs/heads/main' && vars.DATABRICKS_DEPLOY == 'true'
    needs: [test, integration, validate]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t dev

  deploy-qa:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DATABRICKS_DEPLOY == 'true'
    needs: [test, integration, validate]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t qa
      - run: databricks bundle run preparar_ambiente -t qa
      # Prueba de integración: el job completo en qa. Si el chequeo falla, el tag no llega a prod.
      - run: databricks bundle run job_diario -t qa

  deploy-prod:
    if: startsWith(github.ref, 'refs/tags/v') && vars.DATABRICKS_DEPLOY == 'true'
    needs: deploy-qa
    runs-on: ubuntu-latest
    environment: prod   # Required reviewers en GitHub: alguien aprueba antes de este paso
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - run: databricks bundle deploy -t prod
      - run: databricks bundle run preparar_ambiente -t prod
      - run: databricks bundle run job_diario -t prod
